[package]
name = "banshee"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Offline, pipe-friendly security analysis toolkit"
license = "MIT"
repository = "https://github.com/dRafaleD/Banshee"
readme = "README.md"
keywords = ["security", "forensics", "ioc", "malware-analysis", "cli"]
categories = ["command-line-utilities", "encoding", "parser-implementations"]
# Keep the published crate to source, docs and examples; images, fuzzing and
# release outputs stay in the repository.
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
]

[[bin]]
name = "banshee"
path = "src/main.rs"

# Native builds keep every capability. Builds for targets without C toolchains
# or OS randomness (such as wasm32-unknown-unknown) can disable these.
[features]
default = ["xz", "crypto-verify", "line-editor"]
# XZ decompression through liblzma.
xz = ["dep:xz2"]
# JWT signature and X.509 chain signature verification through ring.
crypto-verify = ["dep:jsonwebtoken", "x509-parser/verify"]
# Tab completion and line editing in the interactive console. Without it the
# console reads plain lines; the browser build leaves it out.
line-editor = ["dep:rustyline"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
html-escape = "0.2"
idna = "1.1"
jsonwebtoken = { version = "9.3.1", default-features = false, features = ["use_pem"], optional = true }
md4 = "0.10"
md-5 = "0.10"
percent-encoding = "2.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
url = "2.5"
x509-parser = "0.18"
xz2 = { version = "0.1", optional = true }
zip = { version = "7.2", default-features = false, features = ["deflate"] }
rustyline = { version = "18.0.1", default-features = false, optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rcgen = "0.14"

# Prebuilt archives from the release workflow, for `cargo binstall banshee`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = "thin"
strip = true
