[package]
name = "banshee"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Offline, pipe-friendly security analysis toolkit"

[[bin]]
name = "banshee"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
html-escape = "0.2"
idna = "1.1"
jsonwebtoken = { version = "9.3.1", default-features = false, features = ["use_pem"] }
md4 = "0.10"
md-5 = "0.10"
percent-encoding = "2.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
url = "2.5"
x509-parser = { version = "0.18", features = ["verify"] }
xz2 = "0.1"
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rcgen = "0.14"

[profile.release]
lto = "thin"
strip = true
