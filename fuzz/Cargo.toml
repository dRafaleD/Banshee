[package]
name = "banshee-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
banshee = { path = "..", default-features = false, features = ["xz", "crypto-verify"] }
clap = "4.5"
serde_json = "1.0"

[[bin]]
name = "file_inspect"
path = "fuzz_targets/file_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analyze"
path = "fuzz_targets/analyze.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ioc_extract"
path = "fuzz_targets/ioc_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rules_scan"
path = "fuzz_targets/rules_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cert_parse"
path = "fuzz_targets/cert_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt_inspect"
path = "fuzz_targets/jwt_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_compat"
path = "fuzz_targets/report_compat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recipe"
path = "fuzz_targets/recipe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_roundtrip"
path = "fuzz_targets/codec_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yara_import"
path = "fuzz_targets/yara_import.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
