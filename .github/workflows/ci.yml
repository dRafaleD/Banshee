name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Check and package (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: macos-15
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install xz
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Generate production SBOM
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-cyclonedx installation failed' }
          ./scripts/sbom.ps1
      - name: Package and smoke-test release binary
        shell: pwsh
        run: ./scripts/package.ps1 -SbomPath target/banshee.sbom.json
      - name: Test isolated source installation
        shell: pwsh
        run: |
          if ($IsWindows) {
            ./scripts/test-install.ps1
          } else {
            bash ./scripts/test-install.sh
            if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
          }
      - name: Reject incompatible dependency inventories
        shell: pwsh
        run: ./scripts/test-package.ps1 -SbomPath target/banshee.sbom.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banshee-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  web:
    name: Browser build (wasm32, no native libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            web -> target
      - name: Library without native features
        run: |
          cargo test --no-default-features --lib --locked
          cargo clippy --no-default-features --lib --locked -- -D warnings
      - name: WebAssembly module
        working-directory: web
        run: |
          cargo fmt -- --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo build --locked --release --target wasm32-unknown-unknown
      - name: Module imports no host functions
        run: |
          python3 - <<'CHECK'
          data = open("web/target/wasm32-unknown-unknown/release/banshee_web.wasm", "rb").read()
          assert data[:4] == b"\x00asm", "not a WebAssembly module"
          def leb(index):
              value = shift = 0
              while True:
                  byte = data[index]; index += 1
                  value |= (byte & 0x7F) << shift; shift += 7
                  if byte < 0x80:
                      return value, index
          index = 8
          while index < len(data):
              section = data[index]
              size, index = leb(index + 1)
              if section == 2:
                  count, _ = leb(index)
                  assert count == 0, f"module imports {count} host functions"
              index += size
          print("no imports")
          CHECK
  provenance:
    name: Verify candidate provenance (${{ matrix.triple }})
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'dRafaleD/Banshee'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: macos-15
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: banshee-${{ matrix.os }}
          path: dist
      - name: Verify archive and select SBOM
        id: package
        shell: bash
        run: |
          cd dist
          sha256sum --check *.sha256
          archive=$(find "$PWD" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \))
          sbom=$(find "$PWD" -maxdepth 1 -type f -name '*.sbom.json')
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          test "$(printf '%s\n' "$sbom" | wc -l)" -eq 1
          test -f "$archive" && test -f "$sbom"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Attest production dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - name: Verify both attestations
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh attestation verify "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
          gh attestation verify "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --predicate-type https://cyclonedx.org/bom
