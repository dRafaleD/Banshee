name: Dependency audit

on:
  push:
    branches: [master]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .github/workflows/security.yml]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
