name: Dependency audit

on:
  push:
    branches: [master, 'codex/**']
    paths: [Cargo.toml, Cargo.lock, 'fuzz/Cargo.toml', 'fuzz/Cargo.lock', .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, 'fuzz/Cargo.toml', 'fuzz/Cargo.lock', .github/workflows/security.yml]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit application and fuzz dependencies
        run: |
          cargo audit --file Cargo.lock --deny warnings
          cargo audit --file fuzz/Cargo.lock --deny warnings
