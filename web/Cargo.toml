[package]
name = "banshee-web"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser build of Banshee: analysis runs locally in WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# liblzma and ring need a C toolchain and OS randomness, so the browser build
# disables XZ decompression and signature verification.
banshee = { path = "..", default-features = false }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["."]
